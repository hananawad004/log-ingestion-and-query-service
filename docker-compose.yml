services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpass}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "work_mem=32MB"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: 1
    mem_limit: 1g

  app:
    build: .
    environment:
      PORT: 8080
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-loguser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-logpass}
      PGDATABASE: ${POSTGRES_DB:-logs}
      MAX_CONCURRENT_INGESTS: 100

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m

volumes:
  pg_data: